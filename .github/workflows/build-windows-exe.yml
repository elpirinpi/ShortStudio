name: Build Windows EXE (KellyClipAi Studio)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend and server bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run build
          npm run build:server

      - name: Prepare Electron desktop directory
        shell: pwsh
        run: |
          if (Test-Path electron/dist) { Remove-Item -Recurse -Force electron/dist }
          Copy-Item -Recurse -Force dist electron/dist
          npm --prefix electron install --no-audit --no-fund

      - name: Package Windows .exe (Installer + Portable)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm --prefix electron run dist:win

      - name: Upload Windows .exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KellyClipAi-Studio-Windows-EXE
          path: |
            release/KellyClipAi-Studio-Setup-*.exe
            release/KellyClipAi-Studio-Portable-*.exe

      - name: Publish GitHub Release with Windows .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: KellyClipAi Studio ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          make_latest: true
          prerelease: false
          files: |
            release/KellyClipAi-Studio-Setup-*.exe
            release/KellyClipAi-Studio-Portable-*.exe
          body: |
            **KellyClipAi Studio (ShortStudio)** para Windows x64 (ejecución 100% local sin hosting).
            Desarrollado por **Kelly Benjamin De La Cruz**.

            Incluye:
            - `KellyClipAi-Studio-Portable-1.0.0.exe` (ejecutable directo sin instalación)
            - `KellyClipAi-Studio-Setup-1.0.0.exe` (instalador completo para Windows)
