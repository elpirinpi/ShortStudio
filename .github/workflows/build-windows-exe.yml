name: Build Windows EXE (KellyClipAi Studio)

# Flujo de publicación (auditoría A4 + M6):
# - Pull request a main/master: solo corre el job "verify" (tsc + build). No se publica nada.
# - Push a main/master: NO dispara nada. Fusionar un PR ya no publica release.
# - Publicar una versión: crear y subir un tag "v*" (p. ej. v1.0.16) apuntando al commit
#   deseado de main. Eso corre "verify" y, si pasa, el build de Windows y la release.
# - workflow_dispatch manual: corre "verify" + build y sube el .exe como artefacto,
#   pero NO publica release (sirve para probar el build sin publicar).
on:
  pull_request:
    branches:
      - main
      - master
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify (tsc + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies (lockfile)
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      - name: Build frontend and server bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run build
          npm run build:server

  build-windows:
    name: Build Windows .exe
    needs: verify
    # Solo en builds por tag (release) o manuales (artefacto, sin release).
    # En pull_request este job no corre: el PR solo se verifica.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Historial y tags completos: la versión de respaldo se deriva del último tag.
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Compute release version
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            # Fuente única de verdad (M6): la versión sale del tag vX.Y.Z.
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart("v")
            if ($ver -notmatch '^\d+\.\d+\.\d+$') {
              throw "El tag '$tag' no es una versión semver válida (se espera vX.Y.Z)."
            }
          } else {
            # Build manual sin tag: última versión publicada (último tag v*) + 1 parche.
            # Es solo para nombrar el artefacto de prueba; no se publica release,
            # así que el auto-updater nunca ve esta versión.
            $latestTag = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1
            if ($latestTag) {
              $parts = $latestTag.TrimStart("v").Split(".")
              $ver = "{0}.{1}.{2}" -f $parts[0], $parts[1], ([int]$parts[2] + 1)
            } else {
              $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
            }
            $tag = "v$ver"
          }
          $env:APP_VERSION = $ver
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node -e "const fs=require('fs'); const v=process.env.APP_VERSION; if(!v) throw new Error('Missing APP_VERSION'); for (const p of ['package.json','electron/package.json']) { const j=JSON.parse(fs.readFileSync(p,'utf8')); j.version=v; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n'); }"

      - name: Install root dependencies (lockfile)
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build frontend and server bundle
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run build
          npm run build:server

      - name: Prepare Electron desktop directory
        shell: pwsh
        run: |
          if (Test-Path electron/dist) { Remove-Item -Recurse -Force electron/dist }
          Copy-Item -Recurse -Force dist electron/dist
          npm --prefix electron ci --no-audit --no-fund --legacy-peer-deps

      - name: Package Windows .exe (Installer + Portable)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm --prefix electron run dist:win -- --publish never

      - name: Upload Windows .exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KellyClipAi-Studio-Windows-EXE
          path: |
            release/KellyClipAi-Studio-Setup-*.exe
            release/KellyClipAi-Studio-Portable-*.exe

      - name: Publish GitHub Release with Windows .exe
        # Solo los builds por tag publican. Un workflow_dispatch jamás publica.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: KellyClipAi Studio ${{ env.RELEASE_TAG }}
          make_latest: true
          prerelease: false
          files: |
            release/KellyClipAi-Studio-Setup-*.exe
            release/KellyClipAi-Studio-Portable-*.exe
          body: |
            **KellyClipAi Studio (ShortStudio) ${{ env.RELEASE_TAG }}** para Windows x64 (ejecución 100% local + autoactualización desde GitHub).
            Desarrollado por **Kelly Benjamin De La Cruz**.

            Incluye:
            - `KellyClipAi-Studio-Portable-${{ env.APP_VERSION }}.exe` (ejecutable directo sin instalación)
            - `KellyClipAi-Studio-Setup-${{ env.APP_VERSION }}.exe` (instalador completo para Windows)
